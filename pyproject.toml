[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ignition"
version = "0.1.0"
description = "Python preparation library and CLI runner for the Helios CUDA graph serving core"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "helios/licenses/PyTorch.txt"]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
ignition = "ignition.__main__:main"

[project.optional-dependencies]
test = ["pytest>=9,<10", "tiktoken>=0.12,<1"]
api-test = ["pytest>=9,<10", "openai>=2,<3", "anthropic>=0.70,<1"]
prepare = [
    "cryptography>=46,<52",
    "torch==2.14.1+cu132",
    "torchvision==0.29.1+cu132",
    "transformers[torch,vision,chat_template]==5.23.0",
    "flashinfer-python[b12x]",
    "cuda-python==13.3.1",
    "cuda-tile[tileiras]==1.6.0",
    "safetensors==0.8.0",
    "tokenizers==0.23.2",
    "huggingface-hub==1.33.0",
    "accelerate==1.14.0",
    "Pillow==12.3.0",
    "flare-heliopause",
    "protobuf>=7.36.2,<8",
    "rich>=13",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
flare-heliopause = { path = "heliopause" }
flashinfer-python = { git = "https://github.com/local-inference-lab/flashinfer.git", branch = "main" }

[tool.setuptools.packages.find]
include = ["ignition*"]

[tool.setuptools.package-data]
"ignition.preparation" = ["ladders/*.json", "kv_codec_gpu.cu"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
